name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build application with test profile
        run: ./gradlew clean build -P:profile=test

      - name: Start SUT with test profile
        run: java -jar ./artifacts/app-ibank.jar > sut.log 2>&1 &

      - name: Wait for SUT to be ready
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:9999; then
              echo "SUT is up!"
              exit 0
            fi
            echo "Waiting for application to start... Attempt $i"
            sleep 2
          done
          echo "SUT did not start in time" && exit 1

      - name: Run tests
        run: ./gradlew test --stacktrace --info -Dselenide.headless=true

      - name: Upload test report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test



