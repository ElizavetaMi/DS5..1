name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build SUT
        run: java -jar ./artifacts/app-ibank.jar &

      - name: Wait for SUT to be ready
        run: |
          for i in {1..40}; do
            if curl --silent --fail http://localhost:9999; then
              echo "SUT is up!"
              break
            fi
            echo "Waiting for application to start... Attempt $i"
            sleep 5
          done

      - name: Check if port 9999 is open
        run: |
          netstat -tuln | grep 9999 || exit 1

      - name: Run tests
        run: |
          curl --silent --fail http://localhost:9999 || exit 1
          ./gradlew test --stacktrace --info -Dselenide.headless=true

      - name: Upload test report (HTML)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
