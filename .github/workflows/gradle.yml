name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build SUT
        run: java -jar ./artifacts/app-ibank.jar &

      - name: Wait for SUT to be ready
        run: |
          echo "Waiting for application to start..."
          for i in {1..20}; do
            if curl --silent --head --fail http://localhost:9999; then
              echo "SUT is up!"
              break
            fi
            if [ $i -eq 20 ]; then
              echo "SUT did not start after 20 attempts, failing the build."
              exit 1
            fi
            echo "Waiting for application to start... Attempt $i"
            sleep 5
          done

      - name: Run tests
        run: ./gradlew test --stacktrace --info -Dselenide.headless=true

      - name: Upload test report (HTML)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Check running processes
        run: ps aux

      - name: Check open ports
        run: sudo netstat -tuln
